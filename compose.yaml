services:
  gateway:
    build:
      context: .
      target: base
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?Set SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?Set SLACK_APP_TOKEN}
    volumes:
      - ./config:/config:ro
      - ./data/gateway:/state
    networks: [bridge, internet]
    depends_on:
      assistant:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 11m
  assistant:
    build:
      context: .
      target: worker
    environment:
      AGENT_ID: assistant
      CODEX_HOME: /codex
    volumes:
      - ./config:/config:ro
      - ./data/assistant/codex:/codex
      - ./data/assistant/workspace:/workspace
    networks: [bridge, internet]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp=./config/seccomp.json"]
    pids_limit: 256
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  bridge:
    internal: true
  internet: {}
